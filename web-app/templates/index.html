<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Fruit ninja - main menu</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>

<body style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh;">
    <h1 style="font-size: 4rem; text-shadow: 0 0 20px #00ffcc;">fruit ninja</h1>
    <p style="color: #aaa; margin-bottom: 50px;">select your control mode</p>
    <div style="display: flex; gap: 20px;">
        <a href="/play/manual" style="padding: 20pc 40px; background-color: #007bff; color: white; text-decoration: none;
                border-radius: 10px; font-weight: bold; font-size: 1.5rem; box-shadow: 0 0 15px #007bff;
                transition: 0.2s">
            🖱️ manual mode
        </a>

        <a href="/play/gesture" style="padding: 20pc 40px; background-color: #ff0055; color: white; text-decoration: none;
                border-radius: 10px; font-weight: bold; font-size: 1.5rem; box-shadow: 0 0 15px #ff0055;
                transition: 0.2s">
            ✋ gesture mode
        </a>
    </div>
</body>
</html>
