version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    ports:
      - "27017:27017"

  ml-client:
    build: ./machine-learning-client
    ports:
      - "5001:5000"
    env_file:
      - .env
    depends_on:
      - mongodb

  web-app:
    build: ./web-app
    ports:
      - "8080:5000"
    env_file:
      - .env
    depends_on:
      - ml-client

